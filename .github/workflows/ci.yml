name: CI
on:
  push:
    branches: [main, 'shipstate/**']
  pull_request:
jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Configure Git identity
        run: |
          git config --global user.name "SHIPSTATE CI"
          git config --global user.email "shipstate-ci@local"
      - run: npm run certify
